{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<section aria-labelledby="home-heading">
    <h2 id="home-heading">Your Courses</h2>
    <div class="course-grid" role="list">
        {% for course in courses %}
            <article class="course-card" role="listitem" aria-labelledby="course-title-{{ course.id }}">
                <h3 id="course-title-{{ course.id }}">{{ course.title }}</h3>
                <p>{{ course.info }}</p>
                <a href="{{ url_for('course.course_detail', course_id=course.id) }}"
                   class="btn" aria-label="Open course: {{ course.title }}">Open Course</a>
                <button class="btn-read-info" data-text="{{ course.title }}. {{ course.info }}"
                        aria-label="Read information about {{ course.title }}">Read Info</button>
            </article>
        {% endfor %}
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    document.querySelectorAll('.btn-read-info').forEach(btn => {
        btn.addEventListener('click', () => {
            if (window.speakText) window.speakText(btn.dataset.text, {simplify: false});
        });
    });
</script>
{% endblock %}
